table:
  name: organizations
  schema: public
array_relationships:
  - name: invitations
    using:
      foreign_key_constraint_on:
        column: organization_id
        table:
          name: invitations
          schema: public
  - name: members
    using:
      foreign_key_constraint_on:
        column: organization_id
        table:
          name: organization_members
          schema: public
  - name: projects
    using:
      foreign_key_constraint_on:
        column: organization_id
        table:
          name: projects
          schema: public
select_permissions:
  - role: owner
    permission:
      columns: '*'
      filter:
        id:
          _eq: X-Hasura-Organization-Id
  - role: editor
    permission:
      columns: '*'
      filter:
        id:
          _eq: X-Hasura-Organization-Id
  - role: viewer
    permission:
      columns: '*'
      filter:
        id:
          _eq: X-Hasura-Organization-Id
  - role: user
    permission:
      columns: '*'
      filter:
        id:
          _in: X-Hasura-Allowed-Organizations
update_permissions:
  - role: owner
    permission:
      columns:
        - name
        - slug
      filter:
        id:
          _eq: X-Hasura-Organization-Id
      check:
        id:
          _eq: X-Hasura-Organization-Id
