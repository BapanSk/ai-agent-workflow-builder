table:
  name: organization_members
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: organization_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
insert_permissions:
  - role: owner
    permission:
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
      set:
        organization_id: X-Hasura-Organization-Id
      columns:
        - user_id
        - role
select_permissions:
  - role: owner
    permission:
      columns: '*'
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
  - role: editor
    permission:
      columns: '*'
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
  - role: viewer
    permission:
      columns: '*'
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
  - role: user
    permission:
      columns: '*'
      filter:
        organization_id:
          _in: X-Hasura-Allowed-Organizations
update_permissions:
  - role: owner
    permission:
      columns:
        - role
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
delete_permissions:
  - role: owner
    permission:
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
