table:
  name: tasks
  schema: public
object_relationships:
  - name: assignee
    using:
      foreign_key_constraint_on: assignee_id
  - name: creator
    using:
      foreign_key_constraint_on: created_by
  - name: project
    using:
      manual_configuration:
        column_mapping:
          organization_id: organization_id
          project_id: id
        insertion_order: null
        remote_table:
          name: projects
          schema: public
insert_permissions:
  - role: owner
    permission:
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
      set:
        created_by: X-Hasura-User-Id
        organization_id: X-Hasura-Organization-Id
      columns:
        - project_id
        - title
        - description
        - status
        - priority
        - assignee_id
        - due_date
  - role: editor
    permission:
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
        project:
          members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _in:
                - owner
                - editor
      set:
        created_by: X-Hasura-User-Id
        organization_id: X-Hasura-Organization-Id
      columns:
        - project_id
        - title
        - description
        - status
        - priority
        - assignee_id
        - due_date
select_permissions:
  - role: owner
    permission:
      columns: '*'
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
  - role: editor
    permission:
      columns: '*'
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
        project:
          members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns: '*'
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
        project:
          members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: user
    permission:
      columns: '*'
      filter:
        organization_id:
          _in: X-Hasura-Allowed-Organizations
        project:
          members:
            user_id:
              _eq: X-Hasura-User-Id
update_permissions:
  - role: owner
    permission:
      columns:
        - title
        - description
        - status
        - priority
        - assignee_id
        - due_date
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
  - role: editor
    permission:
      columns:
        - title
        - description
        - status
        - priority
        - assignee_id
        - due_date
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
        project:
          members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _in:
                - owner
                - editor
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
delete_permissions:
  - role: owner
    permission:
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
  - role: editor
    permission:
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
        project:
          members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _in:
                - owner
                - editor
