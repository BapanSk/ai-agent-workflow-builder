table:
  name: projects
  schema: public
object_relationships:
  - name: creator
    using:
      foreign_key_constraint_on: created_by
  - name: organization
    using:
      foreign_key_constraint_on: organization_id
array_relationships:
  - name: members
    using:
      manual_configuration:
        column_mapping:
          id: project_id
          organization_id: organization_id
        insertion_order: null
        remote_table:
          name: project_members
          schema: public
  - name: tasks
    using:
      manual_configuration:
        column_mapping:
          id: project_id
          organization_id: organization_id
        insertion_order: null
        remote_table:
          name: tasks
          schema: public
insert_permissions:
  - role: owner
    permission:
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
      set:
        created_by: X-Hasura-User-Id
        organization_id: X-Hasura-Organization-Id
      columns:
        - name
        - description
        - status
  - role: editor
    permission:
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
      set:
        created_by: X-Hasura-User-Id
        organization_id: X-Hasura-Organization-Id
      columns:
        - name
        - description
        - status
select_permissions:
  - role: owner
    permission:
      columns: '*'
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
  - role: editor
    permission:
      columns: '*'
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
        members:
          user_id:
            _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns: '*'
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
        members:
          user_id:
            _eq: X-Hasura-User-Id
  - role: user
    permission:
      columns: '*'
      filter:
        organization_id:
          _in: X-Hasura-Allowed-Organizations
        members:
          user_id:
            _eq: X-Hasura-User-Id
update_permissions:
  - role: owner
    permission:
      columns:
        - name
        - description
        - status
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
  - role: editor
    permission:
      columns:
        - name
        - description
        - status
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
        members:
          user_id:
            _eq: X-Hasura-User-Id
          role:
            _eq: owner
      check:
        organization_id:
          _eq: X-Hasura-Organization-Id
delete_permissions:
  - role: owner
    permission:
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
  - role: editor
    permission:
      filter:
        organization_id:
          _eq: X-Hasura-Organization-Id
        members:
          user_id:
            _eq: X-Hasura-User-Id
          role:
            _eq: owner
